name: Supabase keep-alive

# The free Supabase plan pauses a project after about a week without activity.
# This job sends a small read request to the database every 3 days so it stays awake.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keepalive.yml'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://evgjmraxekonbklbxyfo.supabase.co
          # Public anon key (the same one shipped in the site bundle).
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2Z2ptcmF4ZWtvbmJrbGJ4eWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwOTAzNDAsImV4cCI6MjEwMDY2NjM0MH0.PkdjBMg2HaYR6FOX4ROx_ezdsxi7-ZCUUdYa_2YgCkY
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::Supabase looks down or paused (HTTP $code)"
            exit 1
          fi
