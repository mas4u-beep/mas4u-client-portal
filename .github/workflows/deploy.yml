name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/,
          # so the base path must match the repository name.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional: set a repository secret named GEMINI_API_KEY to enable the AI features.
          # NOTE: on a public site this key becomes visible in the built JS. Leave empty to keep AI off.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Supabase shared database. The anon (public) key is designed to be shipped
          # in the browser bundle; access is governed by Row Level Security.
          VITE_SUPABASE_URL: https://evgjmraxekonbklbxyfo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2Z2ptcmF4ZWtvbmJrbGJ4eWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwOTAzNDAsImV4cCI6MjEwMDY2NjM0MH0.PkdjBMg2HaYR6FOX4ROx_ezdsxi7-ZCUUdYa_2YgCkY
        run: npm run build

      - name: Add SPA fallback (404 -> index)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
